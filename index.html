Here is the step-by-step path from this view:

1. **Find `index.html` in the list:**
   Scroll down the file list on your screen until you see **`index.html`** (it will be near the bottom, right around where `src/App.jsx` is listed)[cite: 14].

2. **Open the file:**
   Click directly on **`index.html`**.

3. **Click the Edit Pencil:**
   In the top-right corner of the file box (above line 1), click the **pencil icon (✏️)** to open the interactive editor.

4. **Select and replace the script:**
   * Scroll down to the bottom of the file where `<script>` begins.
   * Highlight everything from `<script>` down to `</script>` at the end of the file.
   * Delete that section and paste the clean code block from above.

5. **Commit the changes:**
   Click the green **"Commit changes..."** button at the top right of the page.

Once committed, give GitHub Pages about 60 seconds to update, then do a hard refresh on your live site (**`Ctrl + F5`** or **`Cmd + Shift + R`**)!
